
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Screen</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

  <section class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Login Container -->
    <div class="bg-gray-200 flex flex-col md:flex-row rounded-2xl shadow-lg
                w-full max-w-3xl p-5">

      <!-- FORM -->
      <div class="w-full md:w-1/2 px-4 sm:px-8 md:px-10 lg:px-12 py-5">

        <h2 class="font-bold text-2xl">
          Login
        </h2>

        <p class="text-sm mt-4 text-gray-600">
          If you are already a member, easily login.
        </p>


        <!-- Login Form -->
        <form class="flex flex-col gap-4">

          <!-- Email -->
<input
  class="p-3 mt-6 w-full rounded-xl border border-gray-300
         outline-none focus:ring-2 focus:ring-[#002D74] bg-white"
  type="email"
  name="email"
  placeholder="Email"
>

<!-- Password -->
<div class="relative">

  <input
    class="p-3 rounded-xl border border-gray-300 w-full
           outline-none focus:ring-2 focus:ring-[#002D74] bg-white"
    type="password"
    name="password"
    placeholder="Password"
  >

  <!-- Eye Icon -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="20"
    height="25"
    fill="currentColor"
    class="absolute top-1/2 right-3 -translate-y-1/2
           cursor-pointer text-gray-500"
    viewBox="0 0 16 16"
  >
    <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
  </svg>

</div>


          <!-- Login Button -->
          <button
            type="submit"
            class="bg-[#002D74] hover:scale-105 duration-300
                   text-white rounded-xl py-3 cursor-pointer"
          >
            Login
          </button>

        </form>


        <!-- OR -->
        <div class="mt-8 grid grid-cols-3 items-center gap-3">

          <hr class="border-gray-400">

          <p class="text-center text-sm text-gray-500">
            OR
          </p>

          <hr class="border-gray-400">

        </div>


        <!-- Google Login -->
        <button
  type="button"
  class="bg-white border border-gray-300
         hover:scale-105 duration-300
         py-3 w-full rounded-xl mt-5 relative
         flex justify-center items-center cursor-pointer"
>

  <!-- Google Icons -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    fill="currentColor"
    class="absolute left-4"
    viewBox="0 0 16 16"
    aria-hidden="true"
  >
    <path d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.7 7.7 0 0 1 5.352 2.082l-2.284 2.284A4.35 4.35 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.8 4.8 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.7 3.7 0 0 0 1.599-2.431H8v-3.08z"/>
  </svg>

  Login with Google

</button>


        <!-- Forgot Password -->
        <p class="mt-8 text-xs border-b py-5 text-gray-600 cursor-pointer">
          Forgot your password?
        </p>


        <!-- Register -->
        <div class="mt-4 text-xs flex flex-col sm:flex-row
                    justify-between items-center gap-3">

          <p>
            Don't have an account?
          </p>

          <button
            type="button"
            class="py-2 px-5 bg-white border-b border-gray-400 w-40 sm:w-auto
                   rounded-xl hover:scale-105 duration-300
                   cursor-pointer sm:"
          >
            Register
          </button>

        </div>

      </div>


      <!-- IMAGE -->
      <div class="hidden md:block md:w-1/2">

        <img
          class="w-full h-full object-cover rounded-2xl"
          src="images/photo-1616606103915-dea7be788566.avif"
          alt="Login illustration"
        >

      </div>

    </div>

  </section>

</body>

</html>
