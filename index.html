<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Screen</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <section class="bg-gray-100 min-h-creen flex items-center justify-center h-screen">
   <!-- Login Container -->
    <div class=" bg-gray-80 flex rounded-2xl shadow-lg max-w-3xl p-5 ">
      <!-- form -->
       <div class="md:w-1/2 px-16">
        <h2 class="font-bold text-2xl">
          Login
        </h2>
        <p class="text-sm mt-4">
          If you already a member, easily login
        </p>
        <form class="flex flex-col gap-4">
          <input class="p-2 mt-8 w-full rounded-xl border" type="text" name="email" placeholder="Email">
          <div class="relative ">
            <input class="p-2 rounded-xl border w-full" type="text" name="Password" placeholder="Password">
              <svg
    xmlns="http://www.w3.org/2000/svg"
    width="20px"
    height="25px"
    fill="currentColor"
    class="bi bi-eye absolute top-1/2 right-3 -translate-y-1/2"
    viewBox="0 0 16 16"
  >
    <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
  </svg>
          </div>
          <button class="bg-[#C17819] hover:scale-105 direction-300 text-[F0E2E7] rounded-xl text-white py-2">Login</button>
        </form>
        <div class="mt-10 grid grid-cols-3 items-center ">
          <hr class="border-gray-500">
          <p class="text-center">OR</p>
          <hr class="border-gray-500">
        </div>
        <button
  type="button"
  class="bg-white border-none hover:scale-105 direction-300 py-2 w-full rounded-xl mt-5 relative flex justify-center items-center"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    fill="currentColor"
    class="bi bi-google absolute left-3"
    viewBox="0 0 16 16"
    aria-hidden="true"
  >
    <path d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.7 7.7 0 0 1 5.352 2.082l-2.284 2.284A4.35 4.35 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.8 4.8 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.7 3.7 0 0 0 1.599-2.431H8v-3.08z"/>
  </svg>

  Login with Google
</button>
   <p class="mt-10 text-xs border-b py-6">
    Forget your password?
   </p>
   <div class="mt-3 text-xs flex justify-between items-center">
    <p> Don't have an account?</p>
    <button class="py-2 hover:scale-105 direction-300 px-5 bg-white border-b border-gray-400 rounded-xl">Register </button>
   </div>
       </div>
       <!-- image -->
        

       <div class="w-1/2 md:block hidden w-1/2">
         <img class="rounded-2xl" src="images/login_image-34260873.avif" alt="">
       </div>
       


    </div>

  </section>
</body>
</html>
